<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="box_movie_search">
        <input class="js_movie_input movie_input" type="text" placeholder="Название фильма">
        <button class="js_movie_btn movie_btn">Найти</button>
    </div>

    <div class="js_list_films list_films">
        <p class="empty">Введите название фильма в поиске</p>
    </div>

    <div class="js_popup popup">
        <div class="js_popup_content popup_content">

            <button class="js_popup_close popup_close"><span class="arrow">➜</span> Назад к поиску</button>

            <div class="js_film_details_container popup_wrapper">
            </div>
                
            <template id="filmDetailsStructure">

                <div class="popup_row">
                    <div class="popup_film_poster">
                        <img class="img_popup_film_poster" src="" alt="Постер фильма">
                    </div>
                    <div class="popup_description_film">
                        <h1 class="popup_film_title"></h1>
                        <p class="popup_film_year">
                            <span class="popup_film_year_label">Год:</span>
                            <span class="popup_film_year_value"></span>
                        </p>
                        <p class="popup_film_rated">
                            <span class="popup_film_rated_label">Рейтинг:</span>
                            <span class="popup_film_rated_value"></span>
                        </p>
                        <p class="popup_film_realease">
                            <span class="popup_film_realease_label">Дата выхода:</span>
                            <span class="popup_film_realease_value"></span>
                        </p>
                        <p class="popup_film_runtime">
                            <span class="popup_film_runtime_label">Продолжительность:</span>
                            <span class="popup_film_runtime_value"></span>
                        </p>
                        <p class="popup_film_genre">
                            <span class="popup_film_genre_label">Жанр:</span>
                            <span class="popup_film_genre_value"></span>
                        </p>
                        <p class="popup_film_director">
                            <span class="popup_film_director_label">Режиссер:</span>
                            <span class="popup_film_director_value"></span>
                        </p>
                        <p class="popup_film_writer">
                            <span class="popup_film_writer_label">Сценарий:</span>
                            <span class="popup_film_writer_value"></span>
                        </p>
                        <p class="popup_film_actors">
                            <span class="popup_film_actors_label">Актеры:</span>
                            <span class="popup_film_actors_value"></span>
                        </p>
                    </div>
                </div>

                <div class="popup_colomn">
                    <p class="popup_film_plot"></p>
                </div>
                
            </template>
            
        </div>
    </div>


    <script src="index.js"></script>
</body>
</html>
