<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box_movie_search">
        <input class="js_movie_input movie_input" type="text" placeholder="Название фильма">
        <button class="js_movie_btn movie_btn">Найти</button>
    </div>

    <div class="js_list_films list_films">
        <p class="empty"></p>
    </div>

    <div class="js_popup popup">
        <div class="js_popup_content popup_content">
            <button class="js_popup_close popup_close">закрыть</button>

            <div class="js_film_details_container popup_wrapper">
                
                <template id="filmDetailsStructure">

                    <div class="popup_row">
                        <div class="popup_film_poster">
                            <img class="img_popup_film_poster" src="" alt="Постер фильма">
                        </div>
                        <div class="popup_description_film">
                            <h1 class="popup_film_title"></h1>
                            <p class="popup_film_year"></p>
                            <p class="popup_film_rated"></p>
                        </div>
                    </div>

                    <div class="popup_colomn">
                        <p></p>
                    </div>
                    
                </template>
            </div>
        </div>
    </div>


    <script src="index.js"></script>
</body>
</html>
